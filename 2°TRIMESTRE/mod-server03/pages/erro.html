<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Erro</title>
</head>
<body style="margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #fff5f5; color: #2d3748; display: flex; justify-content: center; align-items: center; min-height: 100vh;">

    <main style="background-color: #ffffff; width: 100%; max-width: 420px; padding: 32px; border-radius: 20px; box-shadow: 0px 18px 40px rgba(229, 62, 62, 0.08); text-align: center; margin: 20px; border: 1px solid #fed7d7;">
        
        <div style="width: 100%; height: 180px; background-color: #fff5f5; border: 2px dashed #feb2b2; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 24px;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#e53e3e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span style="color: #e53e3e; font-size: 13px; font-weight: 500; margin-top: 8px;">Espaço para Ilustração de Erro</span>
        </div>

        <h3 style="font-size: 24px; font-weight: 700; margin: 0 0 8px 0; color: #c53030;">Página de Erro</h3>
        <p style="font-size: 15px; color: #718096; margin: 0 0 28px 0; line-height: 1.5;">Ops! Algo deu errado ou a página não foi encontrada.</p>

        <nav style="display: flex; flex-direction: column; gap: 12px;">
            
            <a href="/compras" style="display: flex; align-items: center; justify-content: center; gap: 10px; background-color: #4318ff; color: #ffffff; text-decoration: none; padding: 14px 20px; border-radius: 12px; font-weight: 600; font-size: 15px; box-shadow: 0px 10px 20px rgba(67, 24, 255, 0.15);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                Navegar para compras
            </a>

            <a href="/erro" style="display: flex; align-items: center; justify-content: center; gap: 10px; background-color: #edf2f7; color: #4a5568; text-decoration: none; padding: 14px 20px; border-radius: 12px; font-weight: 600; font-size: 15px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
                </svg>
                Tentar Novamente 
            </a>

        </nav>
    </main>

</body>
</html>
